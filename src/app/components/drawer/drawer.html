<div
id="drawer-swipe"

class="fixed z-40 w-full overflow-y-auto bg-neutral-primary-soft border-t border-default rounded-t-base transition-transform bottom-0 left-0 right-0 translate-y-full bottom-[60px]" tabindex="-1" aria-labelledby="drawer-swipe-label"
tabindex="-1" aria-labelledby="drawer-swipe-label">


  <button type="button"
  (click)="toggleDrawer()"

  class="p-4 cursor-pointer hover:bg-neutral-secondary-soft" data-drawer-toggle="drawer-swipe">
      <span class="absolute w-8 h-1 -translate-x-1/2 bg-neutral-quaternary rounded-lg top-3 left-1/2"></span>
      <h5 id="drawer-swipe-label" class="inline-flex items-center text-base text-body font-medium">
        <svg class="w-5 h-5 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
         Informació
      </h5>
   </button>

  @if(mapState.selectedPlace(); as place){

        <h5 id="drawer-bottom-example" class=" p-4 inline-flex items-center text-lg font-medium text-body">

      </h5>

      <div class="flex flex-col md:flex-row justify-between items-center gap-8 w-full">

  <div class="flex flex-col items-center p-4">
    <h2 class="mb-2 text-2xl font-medium text-heading">{{place.name}}</h2>
   <ul class="max-w-md space-y-1 text-body list-inside">
    <li tabindex="0">  class="flex items-center">
         <svg class="w-4 h-4 text-fg-success me-1.5 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
       {{place.telf}}
    </li>
    <li  tabindex="0" class="flex items-center">
         <svg class="w-4 h-4 text-fg-success me-1.5 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
      {{place.url}}
    </li>
    <li tabindex="0" class="flex items-center">
         <svg class="w-4 h-4 text-fg-success me-1.5 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
        {{place.direccio}}
    </li>
     <li tabindex="0" class="flex items-center">
         <svg class="w-4 h-4 text-fg-success me-1.5 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
        {{place.email}}
    </li>
</ul>
  </div>

<div class="flex justify-center">
  <img [src]=place.image class="w-64 h-40 p-2  object-cover rounded-lg" [alt]="place.name">
</div>



</div>

  }
